# The WorkdayTracker status page, status.workdaytracker.com.
#
# Upptime checks each address below every five minutes from GitHub Actions, outside Google
# Cloud, commits the results to this repo (the history) and opens an issue per incident.
# The components other than the web app and the API are served by the API at
# /api/status/<id>: 200 while the component is up, 503 when it is down. The ids match
# COMPONENTS in services/jobs/status-checks/src/catalog.ts in the product repo; renaming
# one here starts its history over.
owner: IncomeMath
repo: status

sites:
  - name: Web app
    url: https://workdaytracker.com/app/
    maxResponseTime: 5000
  - name: API and sign-in
    url: https://workdaytracker.com/api/health/readiness
    maxResponseTime: 5000

assignees:
  - Tobiasartz

status-website:
  cname: status.workdaytracker.com
  logoUrl: https://raw.githubusercontent.com/IncomeMath/status/HEAD/assets/favicon.svg
  favicon: https://raw.githubusercontent.com/IncomeMath/status/HEAD/assets/favicon.svg
  faviconSvg: https://raw.githubusercontent.com/IncomeMath/status/HEAD/assets/favicon.svg
  name: WorkdayTracker Status
  introTitle: "WorkdayTracker status"
  introMessage: Live status of the WorkdayTracker web app, desktop recording and reports, checked every five minutes from outside our servers, with the full history of every check and incident.
  navbar:
    - title: Status
      href: /
    - title: WorkdayTracker
      href: https://workdaytracker.com
    - title: History on GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  up: Operational
  down: Down
  degraded: Degraded
